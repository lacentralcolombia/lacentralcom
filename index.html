<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Central - Menú y Catálogo Digital</title>
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <header>
        <h1>Menú y Catálogo Digital</h1>
        <p>Haz clic en "Ver más" en cualquier producto para ampliar la imagen</p>
        
        <!-- Buscador -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar producto (ej: manzana, queso, café...)">
        </div>
    </header>

    <!-- Menú de categorías horizontal corredizo -->
    <nav class="categorias-container" id="categoriasContainer">
        <!-- Generado dinámicamente o por tus scripts -->
    </nav>

    <!-- Contenedor del catálogo de productos -->
    <main class="catalogo-container" id="catalogoContainer">
        <!-- Los productos se cargan aquí -->
    </main>

    <!-- Archivos JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
