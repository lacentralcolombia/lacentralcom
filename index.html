<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA CENTRAL | Catálogo Oficial</title>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- FontAwesome para Íconos de Redes Sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVEGACIÓN / HEADER -->
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/logo.png" alt="LA CENTRAL Logo" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#catalogo">Catálogo</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1>Calidad y Sabor en Tu Mesa</h1>
            <p>Los mejores quesos y embutidos seleccionados especialmente para ti.</p>
            <a href="#catalogo" class="btn-primary"><i class="fa-solid fa-store"></i> Ver Catálogo</a>
        </div>
    </section>

    <!-- CATÁLOGO DE PRODUCTOS -->
    <section id="catalogo" class="catalog-container">
        <h2>Nuestros Productos</h2>
        <div class="category-filter">
            <button class="filter-btn active" onclick="filtrarProductos('todos')">Todos</button>
            <button class="filter-btn" onclick="filtrarProductos('quesos')">Quesos</button>
            <button class="filter-btn" onclick="filtrarProductos('embutidos')">Embutidos</button>
        </div>

        <div id="grid-productos" class="product-grid">
            <!-- Los productos se cargan dinámicamente desde JavaScript -->
        </div>
    </section>

    <!-- FOOTER / REDES SOCIALES Y CONTACTO -->
    <footer id="contacto">
        <div class="footer-content">
            <h3>Síguenos en Redes Sociales</h3>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank" class="social-icon fb"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://instagram.com" target="_blank" class="social-icon ig"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://tiktok.com" target="_blank" class="social-icon tk"><i class="fa-brands fa-tiktok"></i></a>
            </div>
            <p>&copy; 2026 LA CENTRAL - Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- BOTÓN FLOTANTE DE WHATSAPP -->
    <a href="https://wa.me/573000000000?text=Hola,%20quisiera%20consultar%20sobre%20sus%20productos." class="btn-whatsapp" target="_blank" aria-label="Contacto WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
