<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA CENTRAL | Catálogo Oficial</title>
    <!-- FontAwesome Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #e60000;
            --primary-hover: #cc0000;
            --accent: #f7b731;
            --accent-glow: rgba(247, 183, 49, 0.3);
            --dark-bg: #0a0a0c;
            --card-bg: rgba(22, 22, 26, 0.85);
            --text-light: #ffffff;
            --text-muted: #a0a0aa;
            --whatsapp-green: #25d366;
            --whatsapp-hover: #20ba5a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(230, 0, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(247, 183, 49, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 6%;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(247, 183, 49, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(247, 183, 49, 0.3));
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* BOTÓN DE CARRITO EN NAVBAR */
        .cart-icon-btn {
            background: linear-gradient(135deg, var(--primary), #990000);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .cart-icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 0, 0, 0.6);
        }

        .cart-badge {
            background: var(--accent);
            color: #000;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        /* HERO SECTION */
        .hero {
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: linear-gradient(to bottom, rgba(10, 10, 12, 0.4), var(--dark-bg)),
                        url('https://images.unsplash.com/photo-1552767059-ce182eadecec?q=80&w=1920') center/cover no-repeat;
            padding: 0 20px;
        }

        .hero-content {
            max-width: 800px;
            z-index: 2;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin: 15px 0 30px;
            font-weight: 300;
        }

        .btn-hero {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 35px;
            background: linear-gradient(135deg, var(--accent), #d48806);
            color: #000;
            text-decoration: none;
            font-weight: 800;
            border-radius: 40px;
            font-size: 1rem;
            box-shadow: 0 0 25px var(--accent-glow);
            transition: transform 0.3s;
        }

        .btn-hero:hover {
            transform: scale(1.05);
        }

        /* CATÁLOGO */
        .catalog-container {
            padding: 80px 6%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            color: var(--text-light);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--primary);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* FILTROS */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* GRID PRODUCTOS */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(247, 183, 49, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
        }

        .btn-add-cart {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add-cart:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* MODAL / PANEL LATERAL DEL CARRITO */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #121216;
            box-shadow: -10px 0 40px rgba(0,0,0,0.8);
            z-index: 2000;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1999;
            display: none;
        }

        .cart-overlay.open {
            display: block;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .cart-header h3 {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 10px;
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
        }

        .cart-item-details p {
            font-size: 0.85rem;
            color: var(--accent);
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-footer {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .btn-send-whatsapp {
            width: 100%;
            background: var(--whatsapp-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .btn-send-whatsapp:hover {
            background: var(--whatsapp-hover);
        }

        /* FOOTER & CONTACTO */
        footer {
            background: #050507;
            padding: 50px 6% 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .social-icon:hover {
            background: var(--accent);
            color: #000;
            transform: translateY(-3px);
        }

        /* BOTÓN FLOTANTE WHATSAPP */
        .btn-whatsapp-float {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--whatsapp-green);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .btn-whatsapp-float:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo-container">
            <!-- NOMBRE Y RUTA EXACTA DE TU IMAGEN -->
            <img src="assetslogo..jpg" alt="LA CENTRAL Logo" class="logo-img">
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#catalogo">Catálogo</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
        <button class="cart-icon-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Carrito</span>
            <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <!-- HERO SECTION -->
    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1 class="hero-title">LA CENTRAL</h1>
            <p class="hero-subtitle">Calidad, sabor y frescura directa a tu mesa. Explora nuestra variedad exclusiva de quesos y embutidos.</p>
            <a href="#catalogo" class="btn-hero"><i class="fa-solid fa-store"></i> Ver Catálogo Completo</a>
        </div>
    </section>

    <!-- CATÁLOGO -->
    <section id="catalogo" class="catalog-container">
        <h2 class="section-title">Nuestros Productos</h2>
        
        <div class="category-filter">
            <button class="filter-btn active" onclick="filtrarProductos('todos', event)">Todos</button>
            <button class="filter-btn" onclick="filtrarProductos('quesos', event)">Quesos</button>
            <button class="filter-btn" onclick="filtrarProductos('embutidos', event)">Embutidos</button>
        </div>

        <div id="grid-productos" class="product-grid">
            <!-- Carga dinámica vía Javascript -->
        </div>
    </section>

    <!-- OVERLAY & MODAL DEL CARRITO -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h3><i class="fa-solid fa-bag-shopping"></i> Tu Pedido</h3>
            <button class="close-cart" onclick="toggleCart()
