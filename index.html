<!-- CATÁLOGO DIGITAL A ANCHO COMPLETO -->
    <section id="catalogo" class="catalog-section">
        <div class="section-header">
            <h2 class="section-title">Catálogo Digital</h2>
            <p class="section-subtitle">Haz clic en la imagen de cualquier producto para verla en tamaño grande</p>
            
            <!-- BUSCADOR RÁPIDO DE PRODUCTOS -->
            <div class="search-bar-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="input-buscar" placeholder="Buscar producto (ej: liquipops, salchicha, queso...)" onkeyup="buscarProductos()">
            </div>
        </div>

        <div class="catalog-layout-full">
            <!-- BARRA HORIZONTAL DE CATEGORÍAS A LO ANCHO -->
            <nav class="catalog-top-nav">
                <div class="top-nav-menu">
                    <button class="top-nav-btn active" onclick="filtrarCategoria('todos', null, event)">
                        <i class="fa-solid fa-border-all"></i> Todas
                    </button>
                    
                    <button class="top-nav-btn" onclick="filtrarCategoria('quesos', null, event)">
                        <i class="fa-solid fa-cheese"></i> Quesos y Lácteos
                    </button>

                    <!-- DESPLEGABLE EMBUTIDOS -->
                    <div class="top-dropdown">
                        <button class="top-nav-btn" onclick="toggleTopDropdown('dropdown-embutidos', event)">
                            <i class="fa-solid fa-drumstick-bite"></i> Embutidos y Cárnicos <i class="fa-solid fa-chevron-down arrow"></i>
                        </button>
                        <div class="top-dropdown-content" id="dropdown-embutidos">
                            <button onclick="filtrarCategoria('embutidos', 'todos', event)"><i class="fa-solid fa-circle-dot"></i> Ver todos los embutidos</button>
                            <button onclick="filtrarCategoria('embutidos', 'jamones', event)"><i class="fa-solid fa-slash-stroke"></i> Jamones</button>
                            <button onclick="filtrarCategoria('embutidos', 'salchichas', event)"><i class="fa-solid fa-hotdog"></i> Salchichas</button>
                            <button onclick="filtrarCategoria('embutidos', 'chorizos', event)"><i class="fa-solid fa-bacon"></i> Chorizos</button>
                            <button onclick="filtrarCategoria('embutidos', 'mortadelas', event)"><i class="fa-solid fa-circle"></i> Mortadelas</button>
                            <button onclick="filtrarCategoria('embutidos', 'tocinetas', event)"><i class="fa-solid fa-stripes"></i> Tocinetas</button>
                        </div>
                    </div>

                    <button class="top-nav-btn" onclick="filtrarCategoria('alimentos', null, event)">
                        <i class="fa-solid fa-jar"></i> Alimentos y Condimentos
                    </button>

                    <button class="top-nav-btn" onclick="filtrarCategoria('frutos-secos', null, event)">
                        <i class="fa-solid fa-seedling"></i> Frutos Secos
                    </button>

                    <!-- DESPLEGABLE COCTELERÍA Y LIQUIPOPS -->
                    <div class="top-dropdown">
                        <button class="top-nav-btn" onclick="toggleTopDropdown('dropdown-cocteleria', event)">
                            <i class="fa-solid fa-wine-glass-sparkles"></i> Coctelería y Micheladas <i class="fa-solid fa-chevron-down arrow"></i>
                        </button>
                        <div class="top-dropdown-content" id="dropdown-cocteleria">
                            <button onclick="filtrarCategoria('cocteleria', 'todos', event)"><i class="fa-solid fa-circle-dot"></i> Toda coctelería</button>
                            
                            <div class="sub-dropdown-header"><i class="fa-solid fa-burst text-gold"></i> Perlas Explosivas (Liqui POPS):</div>
                            <div class="liqui-subgrid">
                                <button onclick="filtrarCategoria('cocteleria', 'liqui-blueberry', event)"><i class="fa-solid fa-circle" style="color: #4a90e2;"></i> Blueberry</button>
                                <button onclick="filtrarCategoria('cocteleria', 'liqui-coco', event)"><i class="fa-solid fa-circle" style="color: #ffffff;"></i> Coco</button>
                                <button onclick="filtrarCategoria('cocteleria', 'liqui-cereza', event)"><i class="fa-solid fa-circle" style="color: #e3211b;"></i> Cereza</button>
                                <button onclick="filtrarCategoria('cocteleria', 'liqui-lychee', event)"><i class="fa-solid fa-circle" style="color: #f5a623;"></i> Lychee</button>
                                <button onclick="filtrarCategoria('cocteleria', 'liqui-sandia', event)"><i class="fa-solid fa-circle" style="color: #7ed321;"></i> Sandía</button>
                                <button onclick="filtrarCategoria('cocteleria', 'liqui-icepink', event)"><i class="fa-solid fa-circle" style="color: #ff69b4;"></i> Ice Pink</button>
                            </div>

                            <button onclick="filtrarCategoria('cocteleria', 'siropes', event)"><i class="fa-solid fa-bottle-droplet"></i> Siropes y Chamoy</button>
                            <button onclick="filtrarCategoria('cocteleria', 'escarchas', event)"><i class="fa-solid fa-compact-disc"></i> Escarchas y Micheladas</button>
                        </div>
                    </div>

                    <button class="top-nav-btn" onclick="filtrarCategoria('desechables', null, event)">
                        <i class="fa-solid fa-box-open"></i> Plásticos y Desechables
                    </button>
                </div>
            </nav>

            <!-- PRODUCTOS EN CUADRÍCULA COMPLETA -->
            <main class="catalog-content-full">
                <div class="catalog-status-bar">
                    <span id="categoria-activa-titulo">Mostrando: Todas las Categorías</span>
                </div>
                <div id="grid-productos" class="product-grid-full">
                    <!-- Productos dinámicos -->
                </div>
            </main>
        </div>
    </section>
