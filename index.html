<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Central - Menú y Catálogo Digital</title>
    <!-- Ruta corregida apuntando a la carpeta CSS -->
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header class="header-container">
        <div class="logo-title">
            <h1>Menú y Catálogo Digital</h1>
            <p>Haz clic en "Ver más" en cualquier producto para ampliar la imagen</p>
        </div>
        
        <!-- Barra de búsqueda -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar producto (ej: manzana, queso, café...)">
        </div>
    </header>

    <!-- Menú de categorías horizontal corredizo -->
    <nav class="categorias-container" id="categoriasContainer">
        <!-- Las categorías y botones se generan o filtran aquí -->
    </nav>

    <!-- Contenedor principal del catálogo de productos -->
    <main class="catalogo-container" id="catalogoContainer">
        <!-- Los productos se cargarán dinámicamente desde data.js / app.js -->
    </main>

    <!-- Rutas corregidas apuntando a la carpeta js -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
